<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: sans-serif;
        }
        canvas { display: block; touch-action: none; }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .top-bar {
            display: flex; justify-content: space-between; padding: 20px;
        }
        .btn-ui {
            background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 10px; color: white; padding: 6px 14px;
            font-size: 18px; font-weight: bold; pointer-events: auto;
        }
        .score {
            font-size: 28px; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            position: absolute;
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; color: white;
            transition: background 0.1s;
        }
        .btn:active { background: rgba(255, 255, 255, 0.3); }
        
        .btn svg {
            width: 30px; height: 30px; fill: none; stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        }

        #btnLeanBack    { bottom: 110px; left: 20px; }
        #btnLeanForward { bottom: 30px;  left: 60px; }
        #btnGas         { bottom: 110px; right: 20px; }
        #btnBrake       { bottom: 30px;  right: 60px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div class="top-bar">
        <div class="btn-ui">II</div>
        <div class="score"><span id="distanceText">0</span> m</div>
    </div>
    
    <div class="btn" id="btnLeanBack">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
    </div>
    <div class="btn" id="btnLeanForward">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
    </div>

    <div class="btn" id="btnGas">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="rgba(255,255,255,0.6)" stroke="none"/></svg>
    </div>
    <div class="btn" id="btnBrake">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93l14.14 14.14"/></svg>
    </div>
</div>

<script>
    document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body,
          Query = Matter.Query;

    const engine = Engine.create();
    const world = engine.world;
    
    engine.positionIterations = 15; 
    engine.velocityIterations = 12;
    engine.gravity.y = 1; 

    const startX = 50000;
    let groundY = canvas.height - 80; 

    function noise(x) {
        let i = Math.floor(x);
        let f = x - i;
        let u = f * f * (3.0 - 2.0 * f);
        let r1 = Math.sin(i * 12.9898) * 43758.5453;
        let r2 = Math.sin((i + 1) * 12.9898) * 43758.5453;
        r1 = r1 - Math.floor(r1);
        r2 = r2 - Math.floor(r2);
        return r1 * (1 - u) + r2 * u;
    }

    // --- ИСПРАВЛЕНИЕ 1: ОДИН ИСТОЧНИК ПРАВДЫ ДЛЯ ЗЕМЛИ ---
    const SEG = 20; // Шаг 20 пикселей
    const terrainBlocks = [];
    const terrainBodies = []; 
    let lastGeneratedX = startX - 2000;

    function getTerrainY(x) {
        let y = groundY;
        y -= noise(x * 0.001) * 150;  
        y -= noise(x * 0.006) * 50;   
        y -= noise(x * 0.02) * 10;    
        return y;
    }

    function generateTerrain() {
        while (lastGeneratedX < cameraX + (canvas.width / zoom) + 1000) {
            let x1 = lastGeneratedX;
            let x2 = x1 + SEG;
            let y1 = getTerrainY(x1);
            let y2 = getTerrainY(x2);

            let angle = Math.atan2(y2 - y1, x2 - x1);
            let dist = Math.hypot(x2 - x1, y2 - y1) + 2; 
            
            let midX = (x1 + x2) / 2;
            let midY = (y1 + y2) / 2;
            // Опускаем блок вниз на 100 пикселей, чтобы верхняя грань была ровно на линии
            let cx = midX + Math.sin(angle) * 100;
            let cy = midY + Math.cos(angle) * 100;

            let block = Bodies.rectangle(cx, cy, dist, 200, { 
                isStatic: true,
                angle: angle,
                friction: 1, 
                collisionFilter: { category: 0x0002 } 
            });
            
            terrainBlocks.push({ body: block, x: x1, y: y1 });
            terrainBodies.push(block);
            Composite.add(world, block);
            
            lastGeneratedX += SEG;
        }
    }

    function cleanupTerrain() {
        for (let i = terrainBlocks.length - 1; i >= 0; i--) {
            if (terrainBlocks[i].x < cameraX - 2000) {
                Composite.remove(world, terrainBlocks[i].body);
                let index = terrainBodies.indexOf(terrainBlocks[i].body);
                if (index > -1) terrainBodies.splice(index, 1);
                terrainBlocks.splice(i, 1);
            }
        }
    }

    // --- ИСПРАВЛЕНИЕ 2: МАСШТАБ И ПОДВЕСКА ---
    const group = Body.nextGroup(true); 
    const wheelRadius = 18; 
    const wheelBase = 40; 
    
    const suspLength = 15;
    const startY = getTerrainY(startX) - wheelRadius - suspLength; 
    
    const chassis = Bodies.rectangle(startX, startY, 80, 20, { 
        density: 0.4, // Сделали раму тяжелее для стабильности
        collisionFilter: { group: group } 
    }); 

    const wheelRear = Bodies.circle(startX - wheelBase, startY + suspLength, wheelRadius, { 
        density: 0.1, friction: 0.8, collisionFilter: { group: group } 
    });
    const wheelFront = Bodies.circle(startX + wheelBase, startY + suspLength, wheelRadius, { 
        density: 0.1, friction: 0.8, collisionFilter: { group: group } 
    });
    
    // Жесткие пружины, но с реальным ходом (length)
    const suspensionRear = Constraint.create({ 
        bodyA: chassis, 
        pointA: { x: -wheelBase, y: suspLength }, 
        bodyB: wheelRear, 
        stiffness: 0.3, 
        damping: 0.5,
        length: suspLength 
    });
    const suspensionFront = Constraint.create({ 
        bodyA: chassis, 
        pointA: { x: wheelBase, y: suspLength },
        bodyB: wheelFront, 
        stiffness: 0.3, 
        damping: 0.5,
        length: suspLength 
    });

    const moto = Composite.create({ bodies: [wheelRear, wheelFront, chassis], constraints: [suspensionRear, suspensionFront] });
    Composite.add(world, moto);

    const bikeImage = new Image();
    bikeImage.src = 'moto.png'; 
    let isImageLoaded = false;
    bikeImage.onload = () => { isImageLoaded = true; };

    window.isGas = false; window.isBrake = false; 
    window.isLeanBack = false; window.isLeanForward = false;

    function bindBtn(id, variableName) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); window[variableName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); window[variableName] = false; });
        el.addEventListener('touchcancel', (e) => { e.preventDefault(); window[variableName] = false; });
    }
    
    bindBtn('btnGas', 'isGas');
    bindBtn('btnBrake', 'isBrake');
    bindBtn('btnLeanBack', 'isLeanBack');
    bindBtn('btnLeanForward', 'isLeanForward');

    let cameraX = startX - (canvas.width * 0.3);
    let cameraY = 0; 
    const zoom = 1.0; 

    let maxDistance = 0;
    const distanceText = document.getElementById('distanceText');

    generateTerrain();

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100;
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, canvas.height * 2);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = (canvas.height - yOffset) - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, canvas.height * 2);
        ctx.closePath();
        ctx.fill();
    }

    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.position.x, wheel.position.y);
        ctx.rotate(wheel.angle);
        
        ctx.fillStyle = '#000'; 
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius - 4, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            let angle = (i / 4) * Math.PI * 2;
            ctx.beginPath(); 
            ctx.moveTo(0, 0); 
            ctx.lineTo(Math.cos(angle) * (wheelRadius - 4), Math.sin(angle) * (wheelRadius - 4)); 
            ctx.stroke();
        }
        ctx.restore();
    }

    function respawn() {
        let spawnX = cameraX + (canvas.width * 0.3) / zoom;
        let respawnHillY = getTerrainY(spawnX);
        let respawnY = respawnHillY - wheelRadius - suspLength;
        
        Body.setPosition(wheelRear, { x: spawnX - wheelBase, y: respawnY + suspLength });
        Body.setPosition(wheelFront, { x: spawnX + wheelBase, y: respawnY + suspLength });
        Body.setPosition(chassis, { x: spawnX, y: respawnY });
        
        Body.setVelocity(chassis, { x: 0, y: 0 }); 
        Body.setVelocity(wheelRear, { x: 0, y: 0 }); 
        Body.setVelocity(wheelFront, { x: 0, y: 0 });
        Body.setAngle(chassis, 0);
        Body.setAngle(wheelRear, 0);
        Body.setAngle(wheelFront, 0);
        Body.setAngularVelocity(chassis, 0);
        Body.setAngularVelocity(wheelRear, 0);
        Body.setAngularVelocity(wheelFront, 0);
    }

    function update() {
        // --- ИСПРАВЛЕНИЕ 3: ПЛАВНЫЙ ГАЗ ---
        if (window.isGas) { 
            if (wheelRear.angularVelocity < 1.0) {
                Body.setAngularVelocity(wheelRear, wheelRear.angularVelocity + 0.03); 
                Body.setAngularVelocity(wheelFront, wheelFront.angularVelocity + 0.03); 
            }
        }
        
        if (window.isBrake) { 
            Body.setAngularVelocity(wheelRear, wheelRear.angularVelocity * 0.95); 
            Body.setAngularVelocity(wheelFront, wheelFront.angularVelocity * 0.95); 
        }
        
        // Проверка на воздух через реальное касание
        let collRear = Query.collides(wheelRear, terrainBodies);
        let collFront = Query.collides(wheelFront, terrainBodies);
        let isAirborne = (collRear.length === 0 && collFront.length === 0);

        // Вилли
        if (isAirborne) {
            if (window.isLeanBack) Body.setAngularVelocity(chassis, chassis.angularVelocity - 0.01);
            if (window.isLeanForward) Body.setAngularVelocity(chassis, chassis.angularVelocity + 0.01);
        } else {
            if (window.isLeanBack) {
                if (chassis.angle > -0.8) Body.setAngularVelocity(chassis, chassis.angularVelocity - 0.02);
            } else if (window.isLeanForward) {
                if (chassis.angle < 0.8) Body.setAngularVelocity(chassis, chassis.angularVelocity + 0.02);
            } else {
                Body.setAngularVelocity(chassis, chassis.angularVelocity * 0.95);
            }
        }

        // Смерть
        let headX = chassis.position.x + Math.sin(chassis.angle) * 45; 
        let headY = chassis.position.y - Math.cos(chassis.angle) * 45;
        let groundUnderHead = getTerrainY(headX);

        if (headY >= groundUnderHead && !isAirborne) {
            respawn();
        }

        let targetCameraX = chassis.position.x - ((canvas.width * 0.3) / zoom);
        cameraX += (targetCameraX - cameraX) * 0.15; 
        
        let targetCameraY = (canvas.height * 0.5) - chassis.position.y;
        cameraY += (targetCameraY - cameraY) * 0.15;
        
        generateTerrain();
        cleanupTerrain();

        let currentDistance = Math.max(0, Math.floor((chassis.position.x - startX) / 10));
        if (currentDistance > maxDistance) {
            maxDistance = currentDistance;
            distanceText.innerText = maxDistance;
        }

        if (chassis.position.y > canvas.height + 1000) {
            respawn();
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(0, cameraY);
        ctx.translate(-cameraX, 0);

        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);

        // --- ОТРИСОВКА ЗЕМЛИ (ИДЕАЛЬНО СИНХРОНИЗИРОВАНА С ФИЗИКОЙ) ---
        ctx.fillStyle = '#000';
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100;
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        
        // Ищем первый блок в зоне видимости
        let firstBlock = null;
        for (let i = 0; i < terrainBlocks.length; i++) {
            if (terrainBlocks[i].x >= startDrawX) {
                firstBlock = terrainBlocks[i];
                break;
            }
        }
        
        if (firstBlock) {
            ctx.moveTo(firstBlock.x, firstBlock.y);
            for (let i = 0; i < terrainBlocks.length; i++) {
                let b = terrainBlocks[i];
                if (b.x >= startDrawX && b.x <= endDrawX) {
                    ctx.lineTo(b.x, b.y);
                }
            }
            // Дорисовываем последнюю точку и закрываем полигон
            let lastB = terrainBlocks[terrainBlocks.length - 1];
            ctx.lineTo(lastB.x, lastB.y);
            ctx.lineTo(lastB.x, canvas.height + 2000);
            ctx.lineTo(firstBlock.x, canvas.height + 2000);
            ctx.closePath();
            ctx.fill();
        }

        // Мотоцикл
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        
        if (isImageLoaded) {
            ctx.drawImage(bikeImage, -60, -60, 120, 72); 
        }
        ctx.restore();

        drawWheel(wheelRear);
        drawWheel(wheelFront);

        ctx.restore(); 
        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();
    
    window.addEventListener('resize', () => { 
        resizeCanvas(); 
        groundY = canvas.height - 80; 
        
        cameraY = (canvas.height * 0.5) - chassis.position.y;
    });
</script>
</body>
</html>
