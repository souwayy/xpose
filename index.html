<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: sans-serif;
        }
        canvas { display: block; touch-action: none; }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .top-bar {
            display: flex; justify-content: space-between; padding: 20px;
        }
        .btn-ui {
            background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 10px; color: white; padding: 6px 14px;
            font-size: 18px; font-weight: bold; pointer-events: auto;
        }
        .score {
            font-size: 28px; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            position: absolute;
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; color: white;
            transition: background 0.1s;
        }
        .btn:active { background: rgba(255, 255, 255, 0.3); }
        
        .btn svg {
            width: 30px; height: 30px; fill: none; stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        }

        #btnLeanBack    { bottom: 110px; left: 20px; }
        #btnLeanForward { bottom: 30px;  left: 60px; }
        #btnGas         { bottom: 110px; right: 20px; }
        #btnBrake       { bottom: 30px;  right: 60px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div class="top-bar">
        <div class="btn-ui">II</div>
        <div class="score"><span id="distanceText">0</span> m</div>
    </div>
    
    <div class="btn" id="btnLeanBack">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
    </div>
    <div class="btn" id="btnLeanForward">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
    </div>

    <div class="btn" id="btnGas">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="rgba(255,255,255,0.6)" stroke="none"/></svg>
    </div>
    <div class="btn" id="btnBrake">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93l14.14 14.14"/></svg>
    </div>
</div>

<script>
    document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    
    engine.positionIterations = 15; 
    engine.velocityIterations = 12;
    engine.gravity.y = 1; 

    const startX = 50000;
    let groundY = canvas.height - 80; 

    function noise(x) {
        let i = Math.floor(x);
        let f = x - i;
        let u = f * f * (3.0 - 2.0 * f);
        let r1 = Math.sin(i * 12.9898) * 43758.5453;
        let r2 = Math.sin((i + 1) * 12.9898) * 43758.5453;
        r1 = r1 - Math.floor(r1);
        r2 = r2 - Math.floor(r2);
        return r1 * (1 - u) + r2 * u;
    }

    // --- ЗЕМЛЯ НА КРУГАХ (СТАБИЛЬНАЯ) ---
    function getTerrainY(x) {
        let y = groundY;
        y -= noise(x * 0.001) * 100;  
        y -= noise(x * 0.005) * 30;   
        y -= noise(x * 0.015) * 8;    
        return y;
    }

    const terrainBlocks = [];
    let lastGeneratedX = startX - 1500; 
    const chunkWidth = 10; 
    const groundRadius = 20; 

    function generateTerrain() {
        while (lastGeneratedX < cameraX + (canvas.width / zoom) + 1000) {
            let hillY = getTerrainY(lastGeneratedX);
            let block = Bodies.circle(lastGeneratedX, hillY + groundRadius, groundRadius, { 
                isStatic: true, friction: 0.5, frictionStatic: 0.5, collisionFilter: { category: 0x0002 } 
            });
            terrainBlocks.push({ body: block, x: lastGeneratedX, y: hillY });
            Composite.add(world, block);
            lastGeneratedX += chunkWidth;
        }
    }

    function cleanupTerrain() {
        for (let i = terrainBlocks.length - 1; i >= 0; i--) {
            if (terrainBlocks[i].x < cameraX - 1500) {
                Composite.remove(world, terrainBlocks[i].body);
                terrainBlocks.splice(i, 1);
            }
        }
    }

    // --- МОТОЦИКЛ (ТВОИ НАСТРОЙКИ) ---
    const group = Body.nextGroup(true); 
    const wheelRadius = 10; 
    const wheelBase = 23; 
    
    const startY = getTerrainY(startX) - wheelRadius - 15; 
    
    const chassis = Bodies.rectangle(startX, startY, 60, 15, { 
        density: 0.2, 
        collisionFilter: { group: group } 
    }); 

    const wheelRear = Bodies.circle(startX - wheelBase, startY + 10, wheelRadius, { 
        density: 0.05, friction: 0.5, collisionFilter: { group: group } 
    });
    const wheelFront = Bodies.circle(startX + wheelBase, startY + 10, wheelRadius, { 
        density: 0.05, friction: 0.5, collisionFilter: { group: group } 
    });
    
    const suspensionRear = Constraint.create({ 
        bodyA: chassis, 
        pointA: { x: -wheelBase, y: 10 },
        bodyB: wheelRear, 
        stiffness: 0.2, 
        damping: 0.4,
        length: 0 
    });
    const suspensionFront = Constraint.create({ 
        bodyA: chassis, 
        pointA: { x: wheelBase, y: 10 },
        bodyB: wheelFront, 
        stiffness: 0.2, 
        damping: 0.4,
        length: 0 
    });

    const moto = Composite.create({ bodies: [wheelRear, wheelFront, chassis], constraints: [suspensionRear, suspensionFront] });
    Composite.add(world, moto);

    const bikeImage = new Image();
    bikeImage.src = 'moto.png'; 
    let isImageLoaded = false;
    bikeImage.onload = () => { isImageLoaded = true; };

    window.isGas = false; window.isBrake = false; 
    window.isLeanBack = false; window.isLeanForward = false;

    function bindBtn(id, variableName) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); window[variableName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); window[variableName] = false; });
        el.addEventListener('touchcancel', (e) => { e.preventDefault(); window[variableName] = false; });
    }
    
    bindBtn('btnGas', 'isGas');
    bindBtn('btnBrake', 'isBrake');
    bindBtn('btnLeanBack', 'isLeanBack');
    bindBtn('btnLeanForward', 'isLeanForward');

    let cameraX = startX - (canvas.width * 0.3);
    let cameraY = 0; 
    const zoom = 1.1; 

    let maxDistance = 0;
    const distanceText = document.getElementById('distanceText');

    generateTerrain();

    // --- СИСТЕМА ЧАСТИЦ (ПЫЛЬ) ---
    const particles = [];
    
    function createDust(x, y) {
        if (particles.length > 50) return; // Ограничитель, чтобы не лагало
        particles.push({
            x: x + (Math.random() - 0.5) * 10,
            y: y + 5,
            vx: -Math.random() * 2 - 1,
            vy: -Math.random() * 1.5,
            radius: Math.random() * 4 + 2,
            alpha: 0.8
        });
    }

    function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = `rgba(80, 80, 80, ${p.alpha})`; // Темно-серая пыль
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.02;

            if (p.alpha <= 0) particles.splice(i, 1);
        }
    }

    // --- ЗВУК (Web Audio API) ---
    // Создаем синтезатор прямо в браузере, чтобы не искать файлы
    let audioCtx, oscillator, gainNode;
    let isAudioInitialized = false;

    function initAudio() {
        if (isAudioInitialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'sawtooth'; // Звук двигателя
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            gainNode.gain.value = 0; // Изначально тихо
            isAudioInitialized = true;
        } catch(e) { console.log("Аудио не поддерживается"); }
    }

    document.body.addEventListener('touchstart', initAudio, { once: true });

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100;
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, canvas.height * 2);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = (canvas.height - yOffset) - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, canvas.height * 2);
        ctx.closePath();
        ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; 
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4; 

        ctx.beginPath();
        ctx.moveTo(cameraX - 100, canvas.height + 2000);
        
        for (let i = 0; i < terrainBlocks.length; i++) {
            ctx.lineTo(terrainBlocks[i].x, terrainBlocks[i].y);
        }
        
        ctx.lineTo(lastGeneratedX, canvas.height + 2000);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.position.x, wheel.position.y);
        ctx.rotate(wheel.angle);
        
        ctx.fillStyle = '#000'; 
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius - 2, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
            let angle = (i / 4) * Math.PI * 2;
            ctx.beginPath(); 
            ctx.moveTo(0, 0); 
            ctx.lineTo(Math.cos(angle) * (wheelRadius - 2), Math.sin(angle) * (wheelRadius - 2)); 
            ctx.stroke();
        }
        ctx.restore();
    }

    function respawn() {
        let spawnX = cameraX + (canvas.width * 0.3) / zoom;
        let respawnHillY = getTerrainY(spawnX);
        let respawnY = respawnHillY - wheelRadius - 15;
        
        Body.setPosition(wheelRear, { x: spawnX - wheelBase, y: respawnY + 10 });
        Body.setPosition(wheelFront, { x: spawnX + wheelBase, y: respawnY + 10 });
        Body.setPosition(chassis, { x: spawnX, y: respawnY });
        
        Body.setVelocity(chassis, { x: 0, y: 0 }); 
        Body.setVelocity(wheelRear, { x: 0, y: 0 }); 
        Body.setVelocity(wheelFront, { x: 0, y: 0 });
        Body.setAngle(chassis, 0);
        Body.setAngle(wheelRear, 0);
        Body.setAngle(wheelFront, 0);
        Body.setAngularVelocity(chassis, 0);
        Body.setAngularVelocity(wheelRear, 0);
        Body.setAngularVelocity(wheelFront, 0);
    }

    function update() {
        // ЗВУК
        if (isAudioInitialized) {
            if (window.isGas) {
                gainNode.gain.value = 0.03; // Громкость
                // Частота зависит от скорости колес (звук разгона)
                oscillator.frequency.value = 60 + Math.abs(wheelRear.angularVelocity) * 40;
            } else {
                gainNode.gain.value = 0; // Тишина
            }
        }

        // ГАЗ
        if (window.isGas) { 
            Body.setAngularVelocity(wheelRear, 1.2); 
            Body.setAngularVelocity(wheelFront, 1.2); 
            
            // ПЫЛЬ
            if (Math.abs(chassis.velocity.x) > 1) {
                createDust(wheelRear.position.x, wheelRear.position.y + wheelRadius);
            }
        }
        if (window.isBrake) { 
            Body.setAngularVelocity(wheelRear, wheelRear.angularVelocity * 0.9); 
            Body.setAngularVelocity(wheelFront, wheelFront.angularVelocity * 0.9); 
        }
        
        let isAirborne = Math.abs(chassis.velocity.y) > 1.5; 

        // ВИЛЛИ (Твои настройки 0.008 / 0.4)
        let tiltAccel = 0.008; 
        let maxTiltSpeed = 0.4; 

        if (window.isLeanBack) {
            let currentAV = chassis.angularVelocity;
            if (currentAV > -maxTiltSpeed) {
                Body.setAngularVelocity(chassis, currentAV - tiltAccel);
            }
        } 
        else if (window.isLeanForward) {
            let currentAV = chassis.angularVelocity;
            if (currentAV < maxTiltSpeed) {
                Body.setAngularVelocity(chassis, currentAV + tiltAccel);
            }
        } else {
            if (!isAirborne) {
                Body.setAngularVelocity(chassis, chassis.angularVelocity * 0.95);
            }
        }

        // Смерть
        let headX = chassis.position.x + Math.sin(chassis.angle) * 35;
        let headY = chassis.position.y - Math.cos(chassis.angle) * 35;
        let groundUnderHead = getTerrainY(headX);

        if (headY >= groundUnderHead && !isAirborne) {
            respawn();
        }

        // Камера
        let targetCameraX = chassis.position.x - ((canvas.width * 0.3) / zoom);
        cameraX += (targetCameraX - cameraX) * 0.1; 
        
        let targetCameraY = (canvas.height * 0.5) - chassis.position.y;
        cameraY += (targetCameraY - cameraY) * 0.1;
        
        generateTerrain();
        cleanupTerrain();

        let currentDistance = Math.max(0, Math.floor((chassis.position.x - startX) / 10));
        if (currentDistance > maxDistance) {
            maxDistance = currentDistance;
            distanceText.innerText = maxDistance;
        }

        if (chassis.position.y > canvas.height + 1000) {
            respawn();
        }

        // Отрисовка
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(0, cameraY);
        ctx.translate(-cameraX, 0);

        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);

        // Земля
        drawTerrain();

        // Пыль (рисуем ПОД мотоциклом)
        drawParticles();

        // Мотоцикл
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        
        if (isImageLoaded) {
            ctx.drawImage(bikeImage, -45, -45, 90, 54); 
        }
        ctx.restore();

        drawWheel(wheelRear);
        drawWheel(wheelFront);

        ctx.restore(); 
        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();
    
    window.addEventListener('resize', () => { 
        resizeCanvas(); 
        groundY = canvas.height - 80; 
        
        cameraY = (canvas.height * 0.5) - chassis.position.y;
    });
</script>
</body>
</html>
